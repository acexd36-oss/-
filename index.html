<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Химия с нуля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concept: учебник-тетрадь для новичка. Спокойный зелёно-серый фон, один акцент (бирюзовый),
   цвета элементов — как у индикаторных красок. Формулы набраны моноширинным шрифтом. */
:root{
  --bg:#F2F7F5;--surface:#FFFFFF;--ink:#10201B;--muted:#4F625B;--line:#D3DFDA;
  --accent:#0A7B66;--accent-ink:#FFFFFF;--tint:#E2F1EC;
  --good:#17803F;--good-bg:#DDF3E5;--bad:#B93426;--bad-bg:#FBE4E0;
  --elec:#E0572B;--nuc:#10201B;--nuc-ink:#FFFFFF;
  --cs:70%;--cl:86%;--cb:70%;
  --f-d:'Unbounded','Onest',system-ui,sans-serif;
  --f-b:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1512;--surface:#142019;--ink:#E5F0EB;--muted:#9AB1A8;--line:#25382F;
    --accent:#43D6B3;--accent-ink:#04231B;--tint:#18302A;
    --good:#5FD68B;--good-bg:#173A26;--bad:#FF8A7A;--bad-bg:#40201C;
    --elec:#FF8A5C;--nuc:#E5F0EB;--nuc-ink:#0C1512;
    --cs:40%;--cl:22%;--cb:38%;color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0C1512;--surface:#142019;--ink:#E5F0EB;--muted:#9AB1A8;--line:#25382F;
  --accent:#43D6B3;--accent-ink:#04231B;--tint:#18302A;
  --good:#5FD68B;--good-bg:#173A26;--bad:#FF8A7A;--bad-bg:#40201C;
  --elec:#FF8A5C;--nuc:#E5F0EB;--nuc-ink:#0C1512;
  --cs:40%;--cl:22%;--cb:38%;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
sub{font-size:.72em;line-height:0}
.fm{font-family:var(--f-m);font-weight:500;white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{font-family:var(--f-d);font-weight:700;font-size:16px;text-decoration:none;color:var(--ink);letter-spacing:-.01em}
.brand span{color:var(--accent)}
.pgs{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.bar{width:90px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* home */
.hero{padding:48px 0 28px;display:grid;gap:20px}
.hero h1{font-family:var(--f-d);font-weight:700;font-size:clamp(2.1rem,7vw,3.8rem);line-height:1.08;margin:0;letter-spacing:-.03em;text-wrap:balance}
.hero p{margin:0;max-width:56ch;font-size:19px;color:var(--muted)}
.eq{font-family:var(--f-m);font-weight:500;font-size:clamp(1.3rem,4.6vw,2.1rem);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px;width:fit-content;max-width:100%;overflow-x:auto;white-space:nowrap}
.eq b{color:var(--accent);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:600;text-decoration:none;width:fit-content}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:12px 0 36px}
.how div{padding:0}
.how h3{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.how p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.55}
h2.sec{font-family:var(--f-d);font-size:1.4rem;margin:8px 0 16px;letter-spacing:-.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:56px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card .n{font-family:var(--f-m);font-size:13px;color:var(--muted)}
.card h3{margin:0;font-family:var(--f-d);font-size:1.02rem;line-height:1.3;letter-spacing:-.01em}
.card p{margin:0;font-size:15px;color:var(--muted);line-height:1.5;flex:1}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--accent);width:fit-content;font-weight:500}
.chip.done{background:var(--good-bg);color:var(--good)}

/* lesson */
.lesson{padding:28px 0 64px;max-width:760px}
.crumb{font-size:14px;margin-bottom:18px;display:block}
.lesson h1{font-family:var(--f-d);font-weight:700;font-size:clamp(1.7rem,5.5vw,2.5rem);line-height:1.15;margin:0 0 10px;letter-spacing:-.025em;text-wrap:balance}
.lead{font-size:19px;color:var(--muted);margin:0 0 28px}
.lesson h2{font-family:var(--f-d);font-size:1.25rem;margin:36px 0 8px;letter-spacing:-.015em;text-wrap:balance}
.lesson p{margin:0 0 14px;max-width:68ch}
.lesson ul{margin:0 0 16px;padding-left:22px;max-width:68ch}
.lesson li{margin-bottom:6px}
.note{background:var(--tint);border-radius:12px;padding:14px 18px;margin:20px 0;max-width:68ch}
.note .lab{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.note p:last-child{margin:0}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.ex div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15.5px;line-height:1.5}
.ex b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}

/* widgets */
.widget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0 8px;min-width:0}
.widget h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.widget .hint{font-size:15px;color:var(--muted);margin:0 0 14px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.atom-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:center}
.atom-grid svg{width:100%;height:auto;max-width:320px}
.sh{fill:none;stroke:var(--line);stroke-width:1.5}
.el{fill:var(--accent)}.el.v{fill:var(--elec)}
.nuc{fill:var(--nuc)}
.nt{fill:var(--nuc-ink);font-family:var(--f-m);font-size:13px;font-weight:500;text-anchor:middle}
.big{font-family:var(--f-d);font-size:1.6rem;font-weight:700;margin:0 0 6px;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:3px}
.dot.v{background:var(--elec)}

.scroll-x{overflow-x:auto;padding-bottom:6px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));gap:4px;min-width:760px}
.cell{--h:0;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1/1;padding:0;border-radius:6px;
  background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) var(--cs) var(--cb));line-height:1;color:var(--ink)}
.cell small{font-size:9px;opacity:.75;font-family:var(--f-m)}
.cell strong{font-family:var(--f-m);font-size:16px;font-weight:500}
.cell[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.cell.dim{opacity:.22}
.gl{font-size:11px;color:var(--muted);text-align:center;align-self:end}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.lg{--h:0;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.lg i{width:12px;height:12px;border-radius:4px;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) var(--cs) var(--cb))}
.lg[aria-pressed=true]{border-color:var(--ink);font-weight:600}
.det{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center}
.tile{--h:0;width:96px;height:96px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) var(--cs) var(--cb))}
.tile small{font-family:var(--f-m);font-size:12px}
.tile strong{font-family:var(--f-m);font-size:34px;font-weight:500;line-height:1.1}

.pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.pk{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:15px}
.pk[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:20px;line-height:1}
.stepper button:hover{background:var(--tint)}
.stepper b{min-width:32px;text-align:center;font-family:var(--f-m)}
.formula-big{font-family:var(--f-m);font-weight:500;font-size:clamp(1.9rem,8vw,2.8rem);margin:6px 0 2px;line-height:1.2}
table.at{border-collapse:collapse;margin:12px 0 4px;font-size:15.5px;width:100%;max-width:460px}
table.at th,table.at td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
table.at th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
table.at td.ok{color:var(--good);font-weight:600}table.at td.no{color:var(--bad);font-weight:600}
.badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--accent);font-weight:500}

.bond{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}
.ion{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.ion .sym{font-family:var(--f-d);font-size:1.7rem;font-weight:700;line-height:1.2}
.ion .sym sup{font-size:.55em;color:var(--elec)}
.ion p{margin:2px 0 0;font-size:14.5px;color:var(--muted);line-height:1.5}
.msg{font-size:16px;margin:0 0 14px;min-height:3.2em}

.eqn{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;margin:6px 0 14px}
.term{display:flex;flex-direction:column;align-items:center;gap:6px}
.term .fm{font-size:clamp(1.15rem,4.6vw,1.6rem);line-height:1.2}
.op{font-family:var(--f-m);font-size:1.4rem;padding-top:2px}
.preview{font-family:var(--f-m);font-size:1.05rem;color:var(--muted);margin:0 0 10px}
.res{margin:10px 0 0;padding:10px 14px;border-radius:10px;font-weight:500;font-size:16px}
.res.ok{background:var(--good-bg);color:var(--good)}
.res.no{background:var(--tint);color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 14px;font-size:15px}

/* quiz */
.quiz{margin-top:40px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.qt{margin:0 0 10px!important;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-size:16px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.exp{margin:10px 0 0!important;font-size:15.5px;color:var(--muted)}
.score{font-weight:600;font-size:18px;margin:16px 0 8px!important}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}
footer{border-top:1px solid var(--line);padding:20px 0 32px;font-size:14px;color:var(--muted)}

@media (max-width:620px){
  body{font-size:16.5px}
  .atom-grid{grid-template-columns:1fr}
  .atom-grid svg{margin:0 auto;display:block}
  .bond{grid-template-columns:1fr}
  .pgs .bar{width:56px}
  .hero{padding-top:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#home">Химия <span>с нуля</span></a>
  <div class="pgs"><span id="pgtxt"></span><div class="bar" aria-hidden="true"><i id="pgbar" style="width:0%"></i></div></div>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">Учебный проект. Атомные массы округлены, данные для первых 36 элементов.</div></footer>

<script>
/* ---------- helpers ---------- */
const F = s => s.replace(/([A-Za-z)])(\d+)/g, '$1<sub>$2</sub>');
const fm = s => '<span class="fm">' + F(s) + '</span>';
const $ = (r, s) => r.querySelector(s);

function parseF(s){
  let i = 0;
  const num = () => { let d=''; while(i<s.length && /\d/.test(s[i])) d+=s[i++]; return d?parseInt(d,10):1; };
  const grp = () => {
    const m = {};
    while(i < s.length){
      const c = s[i];
      if(c === '('){ i++; const inner = grp(); const n = num(); for(const k in inner) m[k]=(m[k]||0)+inner[k]*n; }
      else if(c === ')'){ i++; return m; }
      else if(/[A-Z]/.test(c)){ let el=c; i++; while(i<s.length && /[a-z]/.test(s[i])) el+=s[i++]; const n=num(); m[el]=(m[el]||0)+n; }
      else i++;
    }
    return m;
  };
  return grp();
}

/* progress (per viewer, optional) */
const KEY = 'chem0-progress';
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ P = {}; }
function saveP(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }

/* ---------- elements 1-36 ---------- */
const CAT = {
  alkali:   {n:'Щелочные металлы', h:5},
  alkaline: {n:'Щёлочноземельные металлы', h:32},
  transition:{n:'Переходные металлы', h:215},
  post:     {n:'Другие металлы', h:190},
  metalloid:{n:'Полуметаллы', h:150},
  nonmetal: {n:'Неметаллы', h:95},
  halogen:  {n:'Галогены', h:55},
  noble:    {n:'Благородные газы', h:282}
};
const catOf = z => [3,11,19].includes(z)?'alkali' : [4,12,20].includes(z)?'alkaline' : (z>=21&&z<=30)?'transition' : [13,31].includes(z)?'post' : [5,14,32,33].includes(z)?'metalloid' : [9,17,35].includes(z)?'halogen' : [2,10,18,36].includes(z)?'noble' : 'nonmetal';
const EL = [
 ['H','Водород',1.008],['He','Гелий',4.003],['Li','Литий',6.94],['Be','Бериллий',9.012],['B','Бор',10.81],['C','Углерод',12.011],
 ['N','Азот',14.007],['O','Кислород',15.999],['F','Фтор',18.998],['Ne','Неон',20.18],['Na','Натрий',22.99],['Mg','Магний',24.305],
 ['Al','Алюминий',26.982],['Si','Кремний',28.085],['P','Фосфор',30.974],['S','Сера',32.06],['Cl','Хлор',35.45],['Ar','Аргон',39.948],
 ['K','Калий',39.098],['Ca','Кальций',40.078],['Sc','Скандий',44.956],['Ti','Титан',47.867],['V','Ванадий',50.942],['Cr','Хром',51.996],
 ['Mn','Марганец',54.938],['Fe','Железо',55.845],['Co','Кобальт',58.933],['Ni','Никель',58.693],['Cu','Медь',63.546],['Zn','Цинк',65.38],
 ['Ga','Галлий',69.723],['Ge','Германий',72.63],['As','Мышьяк',74.922],['Se','Селен',78.971],['Br','Бром',79.904],['Kr','Криптон',83.798]
].map((e,i)=>({z:i+1,s:e[0],n:e[1],m:e[2],c:catOf(i+1)}));
function pos(z){
  if(z===1) return [1,1]; if(z===2) return [1,18];
  if(z<=4) return [2,z-2]; if(z<=10) return [2,z+8];
  if(z<=12) return [3,z-10]; if(z<=18) return [3,z];
  return [4,z-18];
}
function shellsOf(z){ const caps=[2,8,8,2]; let r=z; return caps.map(c=>{const t=Math.min(r,c); r-=t; return t;}).filter(x=>x>0); }

/* ---------- widgets ---------- */
function wAtom(el){
  el.innerHTML = `<h3>Конструктор атома</h3>
  <p class="hint">Двигайте ползунок: меняется число протонов, и вместе с ним сам элемент. Оранжевые точки — внешние (валентные) электроны.</p>
  <label for="zr">Протонов в ядре: <b id="zv"></b></label>
  <input id="zr" type="range" min="1" max="20" value="6">
  <div class="atom-grid"><svg id="asvg" viewBox="0 0 320 320" role="img" aria-label="Модель атома"></svg><div id="ainfo"></div></div>`;
  const svg = $(el,'#asvg'), info = $(el,'#ainfo'), zr = $(el,'#zr');
  function draw(){
    const z = +zr.value, e = EL[z-1], sh = shellsOf(z), A = Math.round(e.m), N = A - z;
    $(el,'#zv').textContent = z;
    const R = [52,82,112,142]; let h = '';
    sh.forEach((cnt,i)=>{ h += `<circle class="sh" cx="160" cy="160" r="${R[i]}"/>`; });
    sh.forEach((cnt,i)=>{ for(let k=0;k<cnt;k++){
      const a = (2*Math.PI*k/cnt) - Math.PI/2 + i*0.5;
      h += `<circle class="el${i===sh.length-1?' v':''}" cx="${(160+R[i]*Math.cos(a)).toFixed(1)}" cy="${(160+R[i]*Math.sin(a)).toFixed(1)}" r="6.5"/>`; } });
    h += `<circle class="nuc" cx="160" cy="160" r="32"/><text class="nt" x="160" y="156">${z}p</text><text class="nt" x="160" y="173">${N}n</text>`;
    svg.innerHTML = h;
    const dots = sh.map((c,i)=>`<span>${'<i class="dot'+(i===sh.length-1?' v':'')+'"></i>'.repeat(0)}</span>`).join('');
    const valence = sh[sh.length-1];
    info.innerHTML = `<p class="big">${e.n} <span class="fm">${e.s}</span></p>
    <dl class="kv">
      <dt>Протоны</dt><dd>${z} (заряд +${z})</dd>
      <dt>Электроны</dt><dd>${z} (заряд −${z})</dd>
      <dt>Нейтроны</dt><dd>${N} = ${A} − ${z}</dd>

    $(el,'#ft').innerHTML = `<p style="margin:4px 0 0">${name}: <span class="badge">${kind}</span></p>

    ${els.map(e=>`<tr><td class="fm">${e}</td><td>${m[e]}</td><td>${k}</td><td><b>${m[e]*k}</b></td></tr>`).join('')}</table>
    <p style="margin:6px 0 0;font-size:15px;color:var(--muted)">В одной молекуле атомов: ${els.reduce((s,e)=>s+m[e],0)}. Во всех: ${els.reduce((s,e)=>s+m[e],0)*k}.</p>`;
  }
  pk.addEventListener('click', ev=>{ const b=ev.target.closest('.pk'); if(!b) return; cur=+b.dataset.i; upd(); });

  {l:['Na','Cl2'], r:['NaCl'], s:[2,1,2]},

function wBalance(el){
  let ri = 0, co = [];
  const gcd = (a,b)=>b?gcd(b,a%b):a;
  el.innerHTML = `<h3>Тренажёр: уравняйте реакцию</h3>
  <p class="hint">Меняйте коэффициенты кнопками − и +. Индексы в формулах менять нельзя. Цель: чтобы атомов каждого элемента слева и справа было поровну.</p>
  <div class="pick" id="rp"></div><div class="eqn" id="eqn"></div><p class="preview" id="pv"></p><div id="tb"></div><div id="rs"></div>
  <div class="acts"><button id="hn">Показать ответ</button><button id="rst">Сбросить</button></div>`;
  const rp = $(el,'#rp');
  rp.innerHTML = RX.map((x,i)=>`<button class="pk" data-i="${i}" aria-pressed="false">Задача ${i+1}</button>`).join('');
  function reset(){ co = RX[ri].l.concat(RX[ri].r).map(()=>1); build(); }
  function build(){
    const x = RX[ri], all = x.l.concat(x.r);
    rp.querySelectorAll('.pk').forEach((b,i)=>b.setAttribute('aria-pressed', i===ri));
    let h = '';
    all.forEach((f,i)=>{
      if(i===x.l.length) h += '<span class="op">→</span>'; else if(i>0) h += '<span class="op">+</span>';
      h += `<div class="term"><span class="fm">${F(f)}</span><span class="stepper"><button data-i="${i}" data-d="-1" aria-label="Уменьшить коэффициент у ${f}">−</button><b>${co[i]}</b><button data-i="${i}" data-d="1" aria-label="Увеличить коэффициент у ${f}">+</button></span></div>`;
    });
    $(el,'#eqn').innerHTML = h;
    const side = (arr,off)=>arr.map((f,i)=>(co[off+i]>1?co[off+i]:'')+F(f)).join(' + ');
    $(el,'#pv').innerHTML = side(x.l,0) + ' → ' + side(x.r,x.l.length);
    const L = {}, R = {};
    x.l.forEach((f,i)=>{ const m=parseF(f); for(const e in m) L[e]=(L[e]||0)+m[e]*co[i]; });
    x.r.forEach((f,i)=>{ const m=parseF(f); for(const e in m) R[e]=(R[e]||0)+m[e]*co[x.l.length+i]; });
    const els = Object.keys(Object.assign({},L,R)); let ok = true;
    $(el,'#tb').innerHTML = `<table class="at"><tr><th>Атом</th><th>Слева</th><th>Справа</th><th></th></tr>${els.map(e=>{ const same=(L[e]||0)===(R[e]||0); if(!same) ok=false;
      return `<tr><td class="fm">${e}</td><td>${L[e]||0}</td><td>${R[e]||0}</td><td class="${same?'ok':'no'}">${same?'✓':'≠'}</td></tr>`; }).join('')}</table>`;
    const g = co.reduce((a,b)=>gcd(a,b));
    $(el,'#rs').innerHTML = ok ? (g===1 ? '<p class="res ok">Верно! Атомов каждого элемента поровну, и коэффициенты наименьшие.</p>'
                                   : '<p class="res ok">Атомов поровну, но коэффициенты можно сократить на '+g+'. Найдите наименьшие.</p>')
                              : '<p class="res no">Пока не поровну. Смотрите на строки с ≠ и меняйте коэффициенты у веществ, где есть этот элемент.</p>';
  }
  $(el,'#eqn').addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(!b) return; const i=+b.dataset.i, d=+b.dataset.d; co[i]=Math.max(1,Math.min(9,co[i]+d)); build(); });
  rp.addEventListener('click', ev=>{ const b=ev.target.closest('.pk'); if(!b) return; ri=+b.dataset.i; reset(); });
  $(el,'#hn').onclick = ()=>{ co = RX[ri].s.slice(); build(); };
  $(el,'#rst').onclick = reset;
  reset();
}

  <div class="note"><span class="lab">Запомни</span><p>Коэффициент умножает всю формулу. Индекс относится только к элементу слева от него.</p></div>
  <h2>Скобки</h2>
  <p>Если индекс стоит после скобок, он умножает всё внутри. В ${fm('Ca(OH)2')} один атом кальция, два атома кислорода и два атома водорода.</p>
  <h2>Простые и сложные вещества</h2>
  <p>В <b>простом</b> веществе один элемент: ${fm('O2')}, ${fm('Fe')}, ${fm('H2')}. В <b>сложном</b> элементов несколько: ${fm('H2O')}, ${fm('CO2')}, ${fm('NaCl')}.</p>`,
  quiz:[
   {q:'Сколько всего атомов в одной молекуле '+fm('H2SO4')+'?', o:['3','4','7','6'], a:2, e:'2 атома H + 1 атом S + 4 атома O = 7.'},
   {q:'Сколько атомов водорода в записи '+fm('3H2O')+'?', o:['2','3','5','6'], a:3, e:'3 молекулы по 2 атома водорода = 6.'},
   {q:'Какое вещество простое?', o:[fm('H2O'),fm('CO2'),fm('NaCl'),fm('O2')], a:3, e:'Кислород состоит только из атомов одного элемента.'}
  ]},
{ t:'Как атомы соединяются', d:'Ионная и ковалентная связь. Почему натрий и хлор образуют соль.', w:wBond,
  lead:'Атомы редко существуют поодиночке. Они соединяются, потому что так их внешний электронный слой становится устойчивым.',
  body:`
  <h2>Почему атомы соединяются</h2>
  <p>Самый устойчивый внешний слой — полный: 8 электронов (у водорода и гелия — 2). Атомы стремятся к такому состоянию и для этого отдают, принимают или делят электроны.</p>
  <h2>Ионная связь</h2>
  <p>Атом металла часто <b>отдаёт</b> электроны, а атом неметалла их <b>принимает</b>. Атом, который отдал электрон, становится положительным <b>ионом</b>, а принявший — отрицательным. Противоположно заряженные ионы притягиваются.</p>
  <h2>Ковалентная связь</h2>
  <p>Два неметалла обычно не отдают электроны, а <b>делят пару электронов</b>. В молекуле ${fm('H2')} общая пара принадлежит обоим атомам, и каждому «кажется», что у него 2 электрона, как у гелия. Так же устроены ${fm('O2')}, ${fm('H2O')}, ${fm('CO2')}.</p>
  <div class="note"><span class="lab">Запомни</span><p>Металл + неметалл → чаще всего ионная связь. Неметалл + неметалл → ковалентная связь.</p></div>`,
  quiz:[
   {q:'Какая связь в соли NaCl?', o:['Ковалентная','Ионная','Связи нет','Такая же, как в H₂'], a:1, e:'Натрий (металл) отдаёт электрон хлору (неметаллу), образуются ионы Na⁺ и Cl⁻.'},
   {q:'Что такое ион Cl⁻?', o:['Атом хлора, отдавший электрон','Атом хлора, принявший электрон','Атом хлора без нейтронов','Молекула хлора'], a:1, e:'Лишний электрон даёт заряд −1.'},
   {q:'Как соединены атомы в молекуле '+fm('H2')+'?', o:['Общей парой электронов','Передачей электрона','Через ионы Na⁺','Они не соединены'], a:0, e:'Это ковалентная связь: два атома делят пару электронов.'}
  ]},
{ t:'Химические реакции', d:'Признаки реакций, исходные вещества и продукты, закон сохранения массы.', w:null,
  lead:'Химическая реакция — это превращение одних веществ в другие. Атомы при этом не исчезают, а соединяются по-новому.',
  body:`
  <h2>Реагенты и продукты</h2>
  <p>Вещества, которые вступают в реакцию, называют <b>исходными</b> (реагентами). Вещества, которые получаются, — <b>продуктами</b>. Реакцию можно записать словами:</p>
  <p class="eq" style="font-size:1.1rem;padding:10px 16px">водород + кислород → вода</p>
  <p>Стрелка читается как «превращается в» или «образуется».</p>
  <h2>Как заметить, что прошла реакция</h2>
  <ul><li>выделяется газ (пузырьки);</li><li>выпадает осадок или меняется цвет;</li><li>появляется запах;</li><li>выделяются или поглощаются тепло и свет.</li></ul>
  <div class="ex"><div><b>Пример</b>сода + уксус: пузырьки углекислого газа</div><div><b>Пример</b>горение свечи: тепло, свет, новые газы</div></div>
  <h2>Закон сохранения массы</h2>
  <p>Масса веществ до реакции равна массе веществ после. Причина простая: атомы не создаются и не пропадают, они только перегруппировываются.</p>
  <div class="note"><span class="lab">Запомни</span><p>В любой реакции число атомов каждого элемента слева и справа одинаково. На этом построено всё следующее занятие.</p></div>`,
  quiz:[
   {q:'Что из этого указывает на химическую реакцию?', o:['Вещество разломали на части','При смешивании соды с уксусом выделяются пузырьки газа','Металл нагрелся на солнце','Сахар измельчили в порошок'], a:1, e:'Выделение газа означает, что появилось новое вещество.'},
   {q:'Что сохраняется в любой реакции?', o:['Число молекул','Число веществ','Число атомов каждого элемента','Цвет'], a:2, e:'Атомы только перегруппировываются, поэтому масса не меняется.'},
   {q:'В реакции '+fm('2H2 + O2 → 2H2O')+' исходные вещества — это…', o:['вода','водород и кислород','только кислород','вода и кислород'], a:1, e:'Исходные вещества стоят слева от стрелки.'}
  ]},
{ t:'Уравнения реакций', d:'Как расставить коэффициенты. Тренажёр с шестью задачами.', w:wBalance,
  lead:'Уравнение реакции — это запись реакции формулами. Чтобы оно было верным, атомов каждого элемента слева и справа должно быть поровну.',
  body:`
  <h2>Алгоритм уравнивания</h2>
  <ul><li>Запишите формулы веществ слева и справа от стрелки.</li><li>Посчитайте атомы каждого элемента слева и справа.</li><li>Расставляйте <b>коэффициенты</b> перед формулами, пока числа не совпадут.</li></ul>
  <div class="note"><span class="lab">Важно</span><p>Менять можно только коэффициенты. Индексы менять нельзя: другой индекс означает другое вещество. ${fm('H2O')} — вода, а ${fm('H2O2')} — пероксид водорода.</p></div>
  <h2>Пример по шагам</h2>
  <p>Реакция: ${fm('H2 + O2 → H2O')}. Считаем: слева 2 атома O, справа 1. Ставим 2 перед водой: ${fm('H2 + O2 → 2H2O')}. Теперь справа 4 атома H, слева 2. Ставим 2 перед водородом:</p>
  <p class="eq" style="font-size:1.4rem;padding:10px 16px">${F('2H2 + O2 → 2H2O')}</p>
  <p>Проверка: слева 4 H и 2 O, справа 4 H и 2 O. Уравнение верное.</p>
  <h2>Совет</h2>
  <p>Начинайте с элемента, который встречается в наименьшем числе веществ. Кислород и водород, которые стоят в простых веществах, уравнивайте в самом конце.</p>`,
  quiz:[
   {q:'Какой коэффициент нужен перед NaCl: 2Na + Cl₂ → ?NaCl', o:['1','2','3','4'], a:1, e:'Слева 2 атома Na и 2 атома Cl, значит справа нужно 2 NaCl.'},
   {q:'Что нельзя менять при уравнивании?', o:['Коэффициенты','Индексы в формулах','Порядок слагаемых','Ничего, можно менять всё'], a:1, e:'Изменив индекс, мы получим другое вещество.'},
   {q:fm('CH4 + 2O2 → CO2 + ?H2O')+' Какой коэффициент нужен перед водой?', o:['1','2','3','4'], a:1, e:'Слева 4 атома H (в CH₄). В одной молекуле воды 2 атома H, значит нужно 2 молекулы.'}
  ]}
];

/* ---------- quiz ---------- */
function mountQuiz(root, idx, onFinish){
  const qs = LESSONS[idx].quiz; let answered = 0, score = 0;
  root.innerHTML = qs.map((q,qi)=>`<div class="q" data-qi="${qi}"><p class="qt">${qi+1}. ${q.q}</p><div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}">${o}</button>`).join('')}</div><p class="exp" hidden></p></div>`).join('') + '<p class="score" hidden></p>';
  root.addEventListener('click', ev=>{
    const b = ev.target.closest('.opt'); if(!b) return;
    const qe = b.closest('.q'); if(qe.dataset.done) return; qe.dataset.done = '1';
    const q = qs[+qe.dataset.qi], oi = +b.dataset.oi, ok = oi===q.a;
    qe.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled = true; if(i===q.a) x.classList.add('right'); else if(i===oi) x.classList.add('wrong'); });
    const ex = $(qe,'.exp'); ex.hidden = false; ex.innerHTML = (ok?'Верно. ':'Не совсем. ') + q.e;
    answered++; if(ok) score++;
    if(answered===qs.length){
      const sc = $(root,'.score'); sc.hidden = false;
      sc.textContent = 'Результат: '+score+' из '+qs.length+(score===qs.length?'. Отлично!':'. Перечитайте урок и попробуйте ещё раз.');
      onFinish(score, qs.length);
    }
  });
}

/* ---------- views ---------- */
const app = $(document,'#app');
function updTop(){
  const n = LESSONS.filter((_,i)=>P[i]!==undefined).length;
  $(document,'#pgtxt').textContent = 'Пройдено '+n+' из '+LESSONS.length;
  $(document,'#pgbar').style.width = (n/LESSONS.length*100)+'%';
}
function home(){
  document.title = 'Химия с нуля';
  app.innerHTML = `
  <section class="hero">
    <h1>Химия с нуля, без паники</h1>
    <p>Семь коротких уроков для тех, кто никогда не учил химию. Каждый урок: простое объяснение, интерактив и мини-тест.</p>
    <div class="eq" aria-label="Пример уравнения реакции">${F('2H2')} + ${F('O2')} <b>→</b> ${F('2H2O')}</div>
    <a class="btn" href="#lesson-1">Начать с первого урока</a>
  </section>
  <section class="how">
    <div><h3>Читаем</h3><p>Короткие абзацы, один новый термин за раз.</p></div>
    <div><h3>Пробуем</h3><p>Собираем атомы, листаем таблицу, уравниваем реакции.</p></div>
    <div><h3>Проверяем</h3><p>Тест после урока объясняет каждый ответ.</p></div>
  </section>
  <h2 class="sec">Программа курса</h2>
  <div class="cards">${LESSONS.map((l,i)=>`<a class="card" href="#lesson-${i+1}"><span class="n">Урок ${i+1}</span><h3>${l.t}</h3><p>${l.d}</p>${P[i]!==undefined?`<span class="chip done">Пройден · ${P[i]} из ${l.quiz.length}</span>`:'<span class="chip">Не начат</span>'}</a>`).join('')}</div>`;
}
function lesson(i){
  const l = LESSONS[i];
  document.title = l.t + ' · Химия с нуля';
  app.innerHTML = `<article class="lesson">
    <a class="crumb" href="#home">← Все уроки</a>
    <span class="chip">Урок ${i+1} из ${LESSONS.length}</span>
    <h1 style="margin-top:12px">${l.t}</h1>
    <p class="lead">${l.lead}</p>
    ${l.w?'<div class="widget" id="wg"></div>':''}
    ${l.body}
    <section class="quiz"><h2>Проверьте себя</h2><div id="qz"></div></section>
    <div class="nav">${i>0?`<a class="btn ghost" href="#lesson-${i}">← Назад</a>`:'<span></span>'}${i<LESSONS.length-1?`<a class="btn" href="#lesson-${i+2}">Следующий урок →</a>`:'<a class="btn" href="#home">К программе</a>'}</div>
  </article>`;
  if(l.w) l.w($(app,'#wg'));
  mountQuiz($(app,'#qz'), i, score=>{ if(P[i]===undefined || score>P[i]) P[i]=score; saveP(); updTop(); });
}
/* in lessons the interactive block sits before the text; reorder so text comes first on the first screen */
function route(){
  const m = /^#lesson-(\d+)$/.exec(location.hash);
  if(m && LESSONS[+m[1]-1]) lesson(+m[1]-1); else home();
  updTop(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
