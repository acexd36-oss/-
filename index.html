<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Химия с нуля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concept: мобильный экран-«дашборд» как в макете Figma: тёмная карточка прогресса с дугой,
   выбор темы и четыре карточки материалов на мягком сиреневато-голубом фоне. */
:root{
  --bg:#E8EDF8;--surface:#FFFFFF;--ink:#141B2D;--muted:#7A859B;--line:#DCE3F0;
  --accent:#0F7F7A;--accent-ink:#FFFFFF;--tint:#E3F1F2;
  --good:#17803F;--good-bg:#DDF3E5;--bad:#B93426;--bad-bg:#FBE4E0;
  --elec:#E0572B;--nuc:#141B2D;--nuc-ink:#FFFFFF;
  --hero-a:#18244A;--hero-b:#0C1330;--arc:#74D6CF;--track:#2B3760;--shadow:0 6px 24px rgba(30,45,90,.08);
  --cs:70%;--cl:86%;--cb:70%;
  --f-b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1F;--surface:#151C32;--ink:#E8ECF7;--muted:#98A3BD;--line:#26304D;
    --accent:#6FD6CF;--accent-ink:#06211F;--tint:#18303A;
    --good:#5FD68B;--good-bg:#173A26;--bad:#FF8A7A;--bad-bg:#40201C;
    --elec:#FF8A5C;--nuc:#E8ECF7;--nuc-ink:#0A0F1F;
    --hero-a:#1D2B58;--hero-b:#0E1637;--track:#2D3A66;--shadow:none;
    --cs:40%;--cl:22%;--cb:38%;color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0A0F1F;--surface:#151C32;--ink:#E8ECF7;--muted:#98A3BD;--line:#26304D;
  --accent:#6FD6CF;--accent-ink:#06211F;--tint:#18303A;
  --good:#5FD68B;--good-bg:#173A26;--bad:#FF8A7A;--bad-bg:#40201C;
  --elec:#FF8A5C;--nuc:#E8ECF7;--nuc-ink:#0A0F1F;
  --hero-a:#1D2B58;--hero-b:#0E1637;--track:#2D3A66;--shadow:none;
  --cs:40%;--cl:22%;--cb:38%;color-scheme:dark}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16.5px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;min-height:100vh;
}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:720px;margin:0 auto;padding:20px 0 56px}
sub{font-size:.72em;line-height:0}
.fm{font-family:var(--f-m);font-weight:500;white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.up{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* home */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:14px;color:var(--muted)}
.hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));border-radius:28px;padding:20px 22px 14px;color:#fff;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-top h1{margin:0;font-size:17px;font-weight:700}
.goal{background:transparent;border:0;color:var(--arc);font-weight:700;font-size:14px;padding:4px 2px}
.gauge{display:block;width:100%;max-width:360px;margin:6px auto 0;height:auto}
.gt,.gp{fill:none;stroke-width:17;stroke-linecap:round}
.gt{stroke:var(--track)}.gp{stroke:var(--arc)}
.gauge text{text-anchor:middle;font-family:var(--f-b)}
.gn{fill:#fff;font-size:46px;font-weight:800;letter-spacing:-.03em}
.gs{fill:#B9C3E0;font-size:14px;font-weight:500}
.gl{fill:#B9C3E0;font-size:12.5px;font-weight:600}
.goalnote{margin:2px 0 6px;font-size:14px;color:#C9D2EC;text-align:center}
.sect{margin:26px 4px 10px}
.sel{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.sel .ic{position:absolute;left:16px;color:var(--accent);pointer-events:none}
.sel .chev{left:auto;right:16px;color:var(--muted)}
.sel select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:transparent;padding:16px 46px 16px 52px;font-weight:700;font-size:16.5px;border-radius:18px;cursor:pointer;text-overflow:ellipsis}
.sel select option{color:#141B2D;background:#fff}
.meta{margin:8px 6px 0;font-size:14px;color:var(--muted);min-height:1.5em}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 12px}
.mh h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.mh span{font-family:var(--f-m);color:var(--muted);font-size:14px}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mat{display:flex;flex-direction:column;gap:4px;min-height:132px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);position:relative;min-width:0}
.mat .row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:auto}
.mat .bub{width:42px;height:42px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.mat .go{color:var(--muted)}
.mat b{font-size:16.5px;font-weight:700;line-height:1.25}
.mat small{color:var(--muted);font-size:13.5px}
.mat[aria-disabled=true]{opacity:.5;pointer-events:none}
a.mat:hover{border-color:var(--accent)}
.hint{display:flex;gap:10px;align-items:flex-start;margin:18px 6px 0;color:var(--muted);font-size:14.5px;line-height:1.5}

/* subpages */
.pagehead{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.back{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);flex:none}
.pagehead .t{min-width:0}
.pagehead .t span{display:block;font-size:13px;color:var(--muted)}
.pagehead .t b{display:block;font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.panel h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.panel h3{margin:22px 0 6px;font-size:17px;font-weight:700}
.panel p{margin:0 0 12px;max-width:66ch}
.panel ul{margin:0 0 14px;padding-left:22px;max-width:66ch}
.panel li{margin-bottom:6px}
.lead{font-size:18px;color:var(--muted)}
.note{background:var(--tint);border-radius:14px;padding:12px 16px;margin:16px 0;max-width:66ch}
.note .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.note p:last-child{margin:0}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.ex div{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:15.5px;line-height:1.5}
.ex b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.eq{font-family:var(--f-m);font-weight:500;background:var(--bg);border-radius:14px;padding:10px 16px;width:fit-content;max-width:100%;overflow-x:auto;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 22px;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}

/* widgets */
.widget{background:var(--bg);border-radius:18px;padding:16px;margin:16px 0;min-width:0}
.widget h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
.widget .wh{font-size:15px;color:var(--muted);margin:0 0 12px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.atom-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:center}
.atom-grid svg{width:100%;height:auto;max-width:300px}
.sh{fill:none;stroke:var(--line);stroke-width:1.5}
.el{fill:var(--accent)}.el.v{fill:var(--elec)}
.nuc{fill:var(--nuc)}
.nt{fill:var(--nuc-ink);font-family:var(--f-m);font-size:13px;font-weight:500;text-anchor:middle}
.big{font-size:1.5rem;font-weight:800;margin:0 0 6px;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:3px}
.dot.v{background:var(--elec)}

.scroll-x{overflow-x:auto;padding-bottom:6px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));gap:4px;min-width:740px}
.cell{--h:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;padding:2px 0;border-radius:8px;
  background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) var(--cs) var(--cb));line-height:1.1;color:var(--ink)}
.cell small{font-size:9px;opacity:.75;font-family:var(--f-m)}
.cell strong{font-family:var(--f-m);font-size:16px;font-weight:500}
.cell em{display:none;font-style:normal;font-size:10px;font-weight:700;font-family:var(--f-m);color:var(--ink)}
.pt.val .cell em{display:block}
.cell[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.cell.dim{opacity:.22}
.gh{font-size:11px;color:var(--muted);text-align:center;align-self:end}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.lg{--h:0;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.lg i{width:12px;height:12px;border-radius:4px;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) var(--cs) var(--cb))}
.lg[aria-pressed=true]{border-color:var(--ink);font-weight:700}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.det{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center}
.tile{--h:0;width:96px;height:96px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) var(--cs) var(--cb))}
.tile small{font-family:var(--f-m);font-size:12px}
.tile strong{font-family:var(--f-m);font-size:34px;font-weight:500;line-height:1.1}

.pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font-size:15px}
.pk[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:20px;line-height:1}
.stepper button:hover{background:var(--tint)}
.stepper b{min-width:32px;text-align:center;font-family:var(--f-m)}
.formula-big{font-family:var(--f-m);font-weight:500;font-size:clamp(1.9rem,8vw,2.8rem);margin:6px 0 2px;line-height:1.2}
table.at{border-collapse:collapse;margin:10px 0 4px;font-size:15.5px;width:100%;max-width:480px}
table.at th,table.at td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
table.at th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
table.at td.ok{color:var(--good);font-weight:700}table.at td.no{color:var(--bad);font-weight:700}
.badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--accent);font-weight:600}
.bond{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.ion{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.ion .sym{font-size:1.7rem;font-weight:800;line-height:1.2}
.ion .sym sup{font-size:.55em;color:var(--elec)}
.ion p{margin:2px 0 0;font-size:14.5px;color:var(--muted);line-height:1.5}
.msg{font-size:16px;margin:0 0 12px;min-height:3.2em}
.eqn{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;margin:6px 0 12px}
.term{display:flex;flex-direction:column;align-items:center;gap:6px}
.term .fm{font-size:clamp(1.15rem,4.6vw,1.6rem);line-height:1.2}
.op{font-family:var(--f-m);font-size:1.4rem;padding-top:2px}
.preview{font-family:var(--f-m);font-size:1.05rem;color:var(--muted);margin:0 0 10px}
.res{margin:10px 0 0;padding:10px 14px;border-radius:12px;font-weight:600;font-size:16px}
.res.ok{background:var(--good-bg);color:var(--good)}
.res.no{background:var(--tint);color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 14px;font-size:15px}
.vb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.vcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.vcol label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vcol select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600;min-width:0;width:100%}
.vsteps{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:15.5px}
.vsteps li{margin:0}
.vf{font-family:var(--f-m);font-weight:500;font-size:clamp(2rem,9vw,3rem);margin:4px 0;line-height:1.2;color:var(--accent)}
.vtab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0 0}
.vtab div{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.vtab b{font-family:var(--f-m);font-weight:500}

/* quiz */
.q{background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.qt{margin:0 0 10px!important;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.exp{margin:10px 0 0!important;font-size:15.5px;color:var(--muted)}
.score{font-weight:700;font-size:18px;margin:14px 0 8px!important}

/* analysis */
.arow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.arow:last-child{border-bottom:0}
.arow b{font-weight:700}
.arow .sc{font-family:var(--f-m);font-size:14px;color:var(--muted)}
.meter{grid-column:1/-1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sumrow{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.sum{flex:1 1 130px;background:var(--bg);border-radius:16px;padding:12px 14px}
.sum b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.sum span{font-size:13.5px;color:var(--muted)}

@media (max-width:620px){
  .atom-grid{grid-template-columns:1fr}
  .atom-grid svg{margin:0 auto;display:block}
  .bond,.vb{grid-template-columns:1fr}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- helpers ---------- */
const F = s => s.replace(/([A-Za-z)])(\d+)/g, '$1<sub>$2</sub>');
const fm = s => '<span class="fm">' + F(s) + '</span>';
const $ = (r, s) => r.querySelector(s);
const ICON = {
  doc:'<rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/>',
  book:'<path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 5.5v15"/><path d="M9 8h6"/>',
  fx:'<text x="2.5" y="17" font-size="15" font-family="Georgia,serif" font-style="italic" fill="currentColor" stroke="none">fx</text>',
  chart:'<path d="M4 4v16h16"/><path d="M8 15l4-5 3 3 4-6"/>',
  arrow:'<path d="M7 17L17 7M9 7h8v8"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const ic = (n,cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

function parseF(s){
  let i = 0;
  const num = () => { let d=''; while(i<s.length && /\d/.test(s[i])) d+=s[i++]; return d?parseInt(d,10):1; };
  const grp = () => {
    const m = {};
    while(i < s.length){
      const c = s[i];
      if(c === '('){ i++; const inner = grp(); const n = num(); for(const k in inner) m[k]=(m[k]||0)+inner[k]*n; }
      else if(c === ')'){ i++; return m; }
      else if(/[A-Z]/.test(c)){ let el=c; i++; while(i<s.length && /[a-z]/.test(s[i])) el+=s[i++]; const n=num(); m[el]=(m[el]||0)+n; }
      else i++;
    }
    return m;
  };
  return grp();
}

/* progress and chosen topic (per viewer, optional) */
const KEY = 'chem0-progress', TKEY = 'chem0-topic';
let P = {}, topic = -1;
try { P = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ P = {}; }
try { const t = parseInt(localStorage.getItem(TKEY),10); if(t>=0 && t<7) topic = t; } catch(e){}
function saveP(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }
function saveT(){ try { localStorage.setItem(TKEY, String(topic)); } catch(e){} }

/* ---------- elements 1-36 ---------- */
const CAT = {
  alkali:   {n:'Щелочные металлы', h:5},
  alkaline: {n:'Щёлочноземельные металлы', h:32},
  transition:{n:'Переходные металлы', h:215},
  post:     {n:'Другие металлы', h:190},
  metalloid:{n:'Полуметаллы', h:150},
  nonmetal: {n:'Неметаллы', h:95},
  halogen:  {n:'Галогены', h:55},

function pos(z){
  if(z===1) return [1,1]; if(z===2) return [1,18];

  return [4,z-18];
}
function shellsOf(z){ const caps=[2,8,8,2]; let r=z; return caps.map(c=>{const t=Math.min(r,c); r-=t; return t;}).filter(x=>x>0); }

/* конструктор формул по валентности */
const ORD = ['Li','Na','K','Mg','Ca','Zn','Al','Fe','Cu','Si','C','P','N','H','S','Br','Cl','O','F'];
const METALS = ['Li','Na','K','Mg','Ca','Zn','Al','Fe','Cu'];
const gcd = (a,b)=>b?gcd(b,a%b):a;
function wValence(el){
  const list = ORD.map(s=>EL.find(e=>e.s===s));
  const opts = list.map(e=>`<option value="${e.s}">${e.n} (${e.s})</option>`).join('');
  el.innerHTML = `<h3>Конструктор формул по валентности</h3>
  <p class="wh">Выберите два элемента и их валентности. Формула получится по правилу «крест-накрест».</p>
  <div class="vb">
    <div class="vcol"><label for="e1">Элемент 1</label><select id="e1">${opts}</select><label for="v1">Валентность</label><select id="v1"></select></div>
    <div class="vcol"><label for="e2">Элемент 2</label><select id="e2">${opts}</select><label for="v2">Валентность</label><select id="v2"></select></div>
  </div><div id="vres"></div>`;
  const e1=$(el,'#e1'), e2=$(el,'#e2'), v1=$(el,'#v1'), v2=$(el,'#v2');
  e1.value='Al'; e2.value='O';
  const fill = (es,vs)=>{ const z=EL.findIndex(e=>e.s===es.value); vs.innerHTML = VAL[z].map(v=>`<option value="${v}">${ROM[v]}</option>`).join(''); };
  function calc(){
    const a = e1.value, b = e2.value, va = +v1.value, vb = +v2.value, res = $(el,'#vres');
    if(a===b){ res.innerHTML = '<p class="res no">Выберите два разных элемента.</p>'; return; }
    if(METALS.includes(a) && METALS.includes(b)){ res.innerHTML = '<p class="res no">Это два металла: они не образуют такого соединения, формулу составить нельзя.</p>'; return; }
    let first = a, vf = va, second = b, vs = vb;
    if(ORD.indexOf(b) < ORD.indexOf(a)){ first = b; vf = vb; second = a; vs = va; }
    const L = va*vb/gcd(va,vb), nf = L/vf, ns = L/vs;
    const formula = first + (nf>1?nf:'') + second + (ns>1?ns:'');
    res.innerHTML = `<ul class="vsteps">
      <li>1. Валентности: ${fm(first)} — ${ROM[vf]}, ${fm(second)} — ${ROM[vs]}.</li>
      <li>2. Наименьшее общее кратное чисел ${vf} и ${vs} — это <b>${L}</b>.</li>
      <li>3. Атомов ${fm(first)}: ${L} ÷ ${vf} = <b>${nf}</b>. Атомов ${fm(second)}: ${L} ÷ ${vs} = <b>${ns}</b>.</li></ul>
      <div class="vf">${F(formula)}</div>
      <p style="margin:0;font-size:15px;color:var(--muted)">Проверка: ${nf} × ${vf} = ${ns} × ${vs} = ${L}. Суммы валентностей с обеих сторон равны.</p>`;
  }
  e1.onchange = ()=>{ fill(e1,v1); calc(); }; e2.onchange = ()=>{ fill(e2,v2); calc(); };
  v1.onchange = calc; v2.onchange = calc;
  fill(e1,v1); fill(e2,v2); calc();
}

const RX = [
  {l:['Na','Cl2'], r:['NaCl'], s:[2,1,2]},
  {l:['H2','O2'], r:['H2O'], s:[2,1,2]},
  {l:['N2','H2'], r:['NH3'], s:[1,3,2]},
  {l:['CH4','O2'], r:['CO2','H2O'], s:[1,2,1,2]},

function wBalance(el){
  let ri = 0, co = [];
  el.innerHTML = `<h3>Тренажёр: уравняйте реакцию</h3>
  <p class="wh">Меняйте коэффициенты кнопками − и +. Индексы в формулах менять нельзя. Цель: чтобы атомов каждого элемента слева и справа было поровну.</p>
  <div class="pick" id="rp"></div><div class="eqn" id="eqn"></div><p class="preview" id="pv"></p><div id="tb"></div><div id="rs"></div>
  <div class="acts"><button id="hn">Показать ответ</button><button id="rst">Сбросить</button></div>`;
  const rp = $(el,'#rp');
  rp.innerHTML = RX.map((x,i)=>`<button class="pk" data-i="${i}" aria-pressed="false">Задача ${i+1}</button>`).join('');
  function reset(){ co = RX[ri].l.concat(RX[ri].r).map(()=>1); build(); }
  function build(){
    const x = RX[ri], all = x.l.concat(x.r);
    rp.querySelectorAll('.pk').forEach((b,i)=>b.setAttribute('aria-pressed', i===ri));
    let h = '';
    all.forEach((f,i)=>{
      if(i===x.l.length) h += '<span class="op">→</span>'; else if(i>0) h += '<span class="op">+</span>';
      h += `<div class="term"><span class="fm">${F(f)}</span><span class="stepper"><button data-i="${i}" data-d="-1" aria-label="Уменьшить коэффициент у ${f}">−</button><b>${co[i]}</b><button data-i="${i}" data-d="1" aria-label="Увеличить коэффициент у ${f}">+</button></span></div>`;
    });
    $(el,'#eqn').innerHTML = h;
    const side = (arr,off)=>arr.map((f,i)=>(co[off+i]>1?co[off+i]:'')+F(f)).join(' + ');
    $(el,'#pv').innerHTML = side(x.l,0) + ' → ' + side(x.r,x.l.length);
    const L = {}, R = {};
    x.l.forEach((f,i)=>{ const m=parseF(f); for(const e in m) L[e]=(L[e]||0)+m[e]*co[i]; });
    x.r.forEach((f,i)=>{ const m=parseF(f); for(const e in m) R[e]=(R[e]||0)+m[e]*co[x.l.length+i]; });
    const els = Object.keys(Object.assign({},L,R)); let ok = true;
    $(el,'#tb').innerHTML = `<table class="at"><tr><th>Атом</th><th>Слева</th><th>Справа</th><th></th></tr>${els.map(e=>{ const same=(L[e]||0)===(R[e]||0); if(!same) ok=false;
      return `<tr><td class="fm">${e}</td><td>${L[e]||0}</td><td>${R[e]||0}</td><td class="${same?'ok':'no'}">${same?'✓':'≠'}</td></tr>`; }).join('')}</table>`;
    const g = co.reduce((a,b)=>gcd(a,b));
    $(el,'#rs').innerHTML = ok ? (g===1 ? '<p class="res ok">Верно! Атомов каждого элемента поровну, и коэффициенты наименьшие.</p>'
                                   : '<p class="res ok">Атомов поровну, но коэффициенты можно сократить на '+g+'. Найдите наименьшие.</p>')
                              : '<p class="res no">Пока не поровну. Смотрите на строки с ≠ и меняйте коэффициенты у веществ, где есть этот элемент.</p>';
  }
  $(el,'#eqn').addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(!b) return; const i=+b.dataset.i, d=+b.dataset.d; co[i]=Math.max(1,Math.min(9,co[i]+d)); build(); });
  rp.addEventListener('click', ev=>{ const b=ev.target.closest('.pk'); if(!b) return; ri=+b.dataset.i; reset(); });
  $(el,'#hn').onclick = ()=>{ co = RX[ri].s.slice(); build(); };
  $(el,'#rst').onclick = reset;
  reset();
}

  <p>Когда бумага горит, появляются новые вещества: пепел, углекислый газ, пары воды. Это <b>химическое</b> явление, или <b>химическая реакция</b>.</p>
  <div class="ex"><div><b>Физические</b>таяние льда, кипение воды, измельчение мела</div><div><b>Химические</b>горение, ржавление, скисание молока</div></div>`,

  body:`

  body:`

{ t:'Как атомы соединяются', w:wBond,

/* ---------- points ---------- */
const GOAL = 50;
const pts = () => LESSONS.reduce((s,l,i)=> P[i]!==undefined ? s + 2*P[i] + 1 : s, 0);

/* ---------- quiz ---------- */
function mountQuiz(root, idx, onFinish){
  const qs = LESSONS[idx].quiz; let answered = 0, score = 0;
  root.innerHTML = qs.map((q,qi)=>`<div class="q" data-qi="${qi}"><p class="qt">${qi+1}. ${q.q}</p><div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}">${o}</button>`).join('')}</div><p class="exp" hidden></p></div>`).join('') + '<p class="score" hidden></p>';
  root.addEventListener('click', ev=>{
    const b = ev.target.closest('.opt'); if(!b) return;
    const qe = b.closest('.q'); if(qe.dataset.done) return; qe.dataset.done = '1';
    const q = qs[+qe.dataset.qi], oi = +b.dataset.oi, ok = oi===q.a;
    qe.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled = true; if(i===q.a) x.classList.add('right'); else if(i===oi) x.classList.add('wrong'); });
    const ex = $(qe,'.exp'); ex.hidden = false; ex.innerHTML = (ok?'Верно. ':'Не совсем. ') + q.e;
    answered++; if(ok) score++;
    if(answered===qs.length) onFinish(score, qs.length, $(root,'.score'));
  });
}

/* ---------- views ---------- */
const app = $(document,'#app');
const topicName = i => (i+1)+'. '+LESSONS[i].t;
const head = (sub, title) => `<div class="pagehead"><a class="back" href="#home" aria-label="Назад к материалам">${ic('back')}</a><div class="t"><span>${sub}</span><b>${title}</b></div></div>`;

function gauge(p){
  const pct = Math.min(p/GOAL,1)*100, d = 'M40 150A110 110 0 0 1 260 150';
  return `<svg class="gauge" viewBox="0 0 300 186" role="img" aria-label="Набрано ${p} из ${GOAL} баллов">
    <path class="gt" d="${d}"/>${p>0?`<path class="gp" d="${d}" pathLength="100" stroke-dasharray="${pct} 100"/>`:''}
    <text class="gn" x="150" y="122">${p}Б</text><text class="gs" x="150" y="146">уже пройдено</text>
    <text class="gl" x="40" y="176">0Б</text><text class="gl" x="150" y="176">Цель этапа</text><text class="gl" x="260" y="176">${GOAL}Б</text></svg>`;
}

  <div class="mh"><h2>Материалы по теме</h2><span>04</span></div>
  <div class="mats">${mats.map(m=>`<a class="mat" data-k="${m[0]}" aria-disabled="true"><div class="row"><span class="bub">${ic(m[1])}</span><span class="go">${ic('arrow')}</span></div><b>${m[2]}</b><small>${m[3]}</small></a>`).join('')}</div>
  <p class="hint" id="hint">${ic('info')}<span>Выберите тему — карточки покажут подходящие материалы.</span></p>`;
  const sel = $(app,'#topic');
  sel.value = String(topic);
  const gb = $(app,'#goalbtn');
  gb.onclick = ()=>{ const n=$(app,'#goalnote'); n.hidden=!n.hidden; gb.setAttribute('aria-expanded', String(!n.hidden)); };
  function apply(){
    const on = topic>=0;
    app.querySelectorAll('.mat').forEach(a=>{
      if(!on || a.dataset.k==='analysis' && false){ a.removeAttribute('href'); a.setAttribute('aria-disabled','true'); return; }
      a.setAttribute('aria-disabled','false');
      a.setAttribute('href', a.dataset.k==='analysis' ? '#analysis' : '#'+a.dataset.k+'-'+(topic+1));
    });
    $(app,'#hint').hidden = on;
    $(app,'#meta').textContent = on ? (P[topic]!==undefined ? 'Тест по этой теме: '+P[topic]+' из '+LESSONS[topic].quiz.length : 'Тест по этой теме ещё не пройден') : '';
  }
  sel.onchange = ()=>{ topic = parseInt(sel.value,10); saveT(); apply(); };
  apply();
}

function lessonView(i){
  const l = LESSONS[i]; document.title = l.t + ' · Химия с нуля';
  app.innerHTML = head('Урок '+(i+1)+' из '+LESSONS.length, l.t) + `
  <article class="panel"><p class="lead">${l.lead}</p>${l.w?'<div class="widget" id="wg"></div>':''}${l.body}</article>
  <div class="nav"><a class="btn ghost" href="#home">К материалам</a><a class="btn" href="#quiz-${i+1}">Пройти тест</a></div>`;
  if(l.w) l.w($(app,'#wg'));
}

function quizView(i){
  const l = LESSONS[i]; document.title = 'Тест · '+l.t;
  app.innerHTML = head('Тест по теме', topicName(i)) + `
  <section class="panel"><div id="qz"></div></section>
  <div class="nav"><a class="btn ghost" href="#lesson-${i+1}">Перечитать урок</a><a class="btn" href="#home">К материалам</a></div>`;
  mountQuiz($(app,'#qz'), i, (score,total,sc)=>{
    const before = pts(); if(P[i]===undefined || score>P[i]) P[i]=score; saveP();
    const gain = pts()-before;
    sc.hidden = false;
    sc.textContent = 'Результат: '+score+' из '+total+(gain>0?'. Вы получили +'+gain+'Б.':'. Баллы за эту тему уже засчитаны за лучший результат.');
  });
}

function formulasView(i){
  document.title = 'Формулы по теме · Химия с нуля';
  app.innerHTML = head('Формулы по теме', i>=0?topicName(i):'Таблица и валентность') + `
  <section class="panel"><div class="widget" id="w1" style="margin-top:0"></div></section>
  <section class="panel"><h2>Что такое валентность</h2>
    <p><b>Валентность</b> — это число связей, которые атом образует с другими атомами. Её записывают римской цифрой: I, II, III, IV…</p>
    <div class="note"><span class="lab">Запомни</span><p>В соединении сумма валентностей атомов с одной стороны равна сумме с другой. Поэтому в воде ${fm('H2O')}: 2 атома H × I = 1 атом O × II.</p></div>
    <h3>Постоянная валентность</h3>
    <ul><li>H, Li, Na, K, F — всегда I;</li><li>O, Mg, Ca, Zn, Be — всегда II;</li><li>Al, B — всегда III.</li></ul>
    <h3>Переменная валентность</h3>
    <p>У многих элементов валентность зависит от соединения. В названии её указывают в скобках: оксид железа(III) — это ${fm('Fe2O3')}.</p>
    <div class="vtab" id="vt"></div>
    <h3>Как найти валентность по таблице</h3>
    <ul><li><b>Высшая</b> валентность элемента главной подгруппы равна номеру группы (для групп 13–18 вычтите 10). Исключения: у O она II, у F — I.</li>
    <li><b>Низшая</b> валентность неметалла равна 8 минус номер группы. У серы (группа 16, то есть VI): 8 − 6 = II. У хлора: 8 − 7 = I.</li></ul>
  </section>
  <section class="panel"><div class="widget" id="w2" style="margin-top:0"></div></section>
  <div class="nav"><a class="btn ghost" href="#home">К материалам</a>${i>=0?`<a class="btn" href="#quiz-${i+1}">Пройти тест</a>`:''}</div>`;
  wTable($(app,'#w1'), {val:true});
  wValence($(app,'#w2'));
  const vt = [[1,'H'],[8,'O'],[11,'Na'],[12,'Mg'],[13,'Al'],[6,'C'],[7,'N'],[15,'P'],[16,'S'],[17,'Cl'],[26,'Fe'],[29,'Cu'],[24,'Cr'],[25,'Mn']];
  $(app,'#vt').innerHTML = vt.map(([z,s])=>`<div><span>${EL[z-1].n}</span><b>${s}: ${roms(VAL[z-1])}</b></div>`).join('');
}

function analysisView(){
  document.title = 'Анализ · Химия с нуля';
  const p = pts(), done = LESSONS.filter((_,i)=>P[i]!==undefined).length;
  const weak = LESSONS.map((l,i)=>({i,l})).filter(x=>P[x.i]!==undefined && P[x.i]<x.l.quiz.length);
  const todo = LESSONS.map((l,i)=>({i,l})).filter(x=>P[x.i]===undefined);
  app.innerHTML = head('Ваши результаты','Анализ') + `
  <section class="panel"><div class="sumrow">
    <div class="sum"><b>${p}Б</b><span>из ${GOAL}Б цели этапа</span></div>
    <div class="sum"><b>${done} из ${LESSONS.length}</b><span>тестов пройдено</span></div></div></section>
  <section class="panel"><h2>По темам</h2>${LESSONS.map((l,i)=>{ const t=l.quiz.length, s=P[i];
    return `<div class="arow"><b>${topicName(i)}</b><span class="sc">${s!==undefined?s+' из '+t:'не пройден'}</span><div class="meter"><i style="width:${s!==undefined?s/t*100:0}%"></i></div></div>`; }).join('')}</section>
  <section class="panel"><h2>Что дальше</h2>
    ${weak.length?`<p>Стоит повторить, там были ошибки:</p><ul>${weak.map(x=>`<li><a href="#lesson-${x.i+1}">${topicName(x.i)}</a></li>`).join('')}</ul>`:''}
    ${todo.length?`<p>Ещё не пройдены:</p><ul>${todo.map(x=>`<li><a href="#quiz-${x.i+1}">${topicName(x.i)}</a></li>`).join('')}</ul>`:''}
    ${(!weak.length && !todo.length)?'<p>Все темы пройдены без ошибок. Отличная работа!</p>':''}</section>
  <div class="nav"><a class="btn ghost" href="#home">К материалам</a></div>`;
}

function route(){
  const m = /^#(lesson|quiz|formulas)-(\d+)$/.exec(location.hash);
  if(m && LESSONS[+m[2]-1]){
    topic = +m[2]-1; saveT();
    ({lesson:lessonView, quiz:quizView, formulas:formulasView})[m[1]](topic);
  } else if(location.hash==='#analysis') analysisView();
  else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>

</body></html>
